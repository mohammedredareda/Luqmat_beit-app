</div>
<div class="flex justify-between items-center font-body-md text-on-surface-variant">

</div>

</div>
<div class="pt-m mt-s border-t border-outline-variant/50 flex justify-between items-center">

</div>

<div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-lg text-label-lg">

            </div>
</section>
<!-- Multi-Chef Warning -->

يجب أن يقع الموعد ضمن أوقات توفر الطباخة
