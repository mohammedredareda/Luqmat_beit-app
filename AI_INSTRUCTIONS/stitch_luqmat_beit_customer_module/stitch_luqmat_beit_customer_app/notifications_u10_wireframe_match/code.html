</button>
<button class="flex-1 py-m text-center text-title-lg font-title-lg text-on-surface-variant transition-colors">
                    إشعارات النظام
                </button></div>
</div>
<!-- Notifications List -->
<div class="flex flex-col gap-l">
<!-- Notification Card 1 (Order Status) -->
<div class="bg-surface rounded-xl p-padding-card flex gap-m items-start relative border border-outline-variant">
<div class="w-2.5 h-2.5 bg-sumac-red rounded-full absolute top-padding-card right-padding-card transform translate-x-1/2 -translate-y-1/2"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0 text-on-secondary-container">
<span class="material-symbols-outlined">package_2</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-xs">
<h3 class="text-title-lg font-title-lg text-on-surface">تغيّرت حالة طلبك</h3>
<span class="text-body-sm font-body-sm text-ink-muted whitespace-nowrap">الآن</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant">
                        طلبك رقم #48291 من "مطبخ أم صهيب" في الطريق إليك. تتبع الطلب لمعرفة وقت الوصول المتوقع.
                    </p>
</div>
</div>
<!-- Notification Card 2 (Split Order Alert - Action Required) -->
<div class="bg-surface rounded-xl border border-outline-variant p-padding-card flex gap-m items-start relative bg-error-container/20">
<div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center flex-shrink-0 text-error">
<span class="material-symbols-outlined">warning</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-xs">
<h3 class="text-title-lg font-title-lg text-error">رفضت طباخة جزءاً من طلبك المقسّم</h3>
<span class="text-body-sm font-body-sm text-ink-muted whitespace-nowrap">منذ ساعتين</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant mb-m"><br></p>
<div class="flex gap-m mt-s flex-row"><button class="bg-sumac-red text-on-primary py-s px-l rounded-full text-label-lg font-label-lg hover:bg-surface-tint transition-colors text-center flex-1">
                            المتابعة بالمقبول
                        </button>
<button class="bg-transparent border border-error text-error py-s px-l rounded-full text-label-lg font-label-lg hover:bg-error-container transition-colors text-center flex-1">

                        </button></div>
</div>
</div>

<span class="text-body-sm font-body-sm text-ink-muted whitespace-nowrap">أمس</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant"><br></p>

</div>
