<script>
        // Simple star rating interaction
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.rating-star');
            
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.getAttribute('data-value'));
                    
                    stars.forEach(s => {
                        const sValue = parseInt(s.getAttribute('data-value'));
                        const icon = s.querySelector('.material-symbols-outlined');
                        
                        if (sValue <= value) {
                            icon.style.fontVariationSettings = "'FILL' 1";
                            icon.classList.remove('text-surface-variant');
                            icon.classList.add('text-honey-gold');
                        } else {
                            icon.style.fontVariationSettings = "'FILL' 0";
                            icon.classList.remove('text-honey-gold');
                            icon.classList.add('text-surface-variant');
                        }
                    });
                });
            });
        });
    </script>
