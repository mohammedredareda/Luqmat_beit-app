<!-- Simple Interactivity Scripts -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon && (icon.innerText === 'add' || icon.innerText === 'remove')) {
                    const counter = this.parentElement.querySelector('span:not(.material-symbols-outlined)');
                    let val = parseInt(counter.innerText);
                    if (icon.innerText === 'add') val++;
                    if (icon.innerText === 'remove' && val > 1) val--;
                    counter.innerText = val;
                }
            });
        });
    </script>
