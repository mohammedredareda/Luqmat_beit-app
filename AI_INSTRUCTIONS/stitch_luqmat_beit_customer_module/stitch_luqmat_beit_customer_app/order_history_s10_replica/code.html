                const text = this.innerText;
                if (text.includes('إعادة الطلب')) {
                    this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync</span>';
                    setTimeout(() => {
                        this.innerHTML = '<span class="font-label-lg text-label-lg">تمت الإضافة ✓</span>';
                        this.classList.replace('bg-sumac-red', 'bg-zaatar-green');

                            this.innerHTML = '<span class="font-label-lg text-label-lg">إعادة الطلب ↻</span>';
                            this.classList.replace('bg-zaatar-green', 'bg-sumac-red');
                        }, 2000);
                    }, 800);
                }
            });
