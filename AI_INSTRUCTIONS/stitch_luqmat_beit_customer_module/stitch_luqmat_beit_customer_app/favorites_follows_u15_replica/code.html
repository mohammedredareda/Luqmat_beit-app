<script>
        function switchTab(tab) {
            const mealsTab = document.getElementById('tab-meals');
            const cooksTab = document.getElementById('tab-cooks');
            const mealsContent = document.getElementById('content-meals');
            const cooksContent = document.getElementById('content-cooks');
            const indicator = document.getElementById('active-indicator');

            if (tab === 'meals') {
                mealsTab.classList.add('text-primary');
                mealsTab.classList.remove('text-on-surface-variant');
                cooksTab.classList.remove('text-primary');
                cooksTab.classList.add('text-on-surface-variant');
                
                mealsContent.classList.remove('hidden');
                cooksContent.classList.add('hidden');
                
                indicator.style.right = '0';
            } else {
                cooksTab.classList.add('text-primary');
                cooksTab.classList.remove('text-on-surface-variant');
                mealsTab.classList.remove('text-primary');
                mealsTab.classList.add('text-on-surface-variant');
                
                cooksContent.classList.remove('hidden');
                mealsContent.classList.add('hidden');
                
                indicator.style.right = '50%';
            }
        }
    </script>
