<div class="flex gap-lg text-sumac-primary mb-2">

            </div>

</div>
<!-- Toggle Switch -->
<button class="relative w-12 h-6 rounded-full bg-surface-variant transition-colors duration-300 focus:outline-none shadow-inner" id="meal-toggle">

<div class="flex flex-col">

</div>

        </button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Character Counter
        const textarea = document.getElementById('video-desc');
        const charCount = document.getElementById('char-count');
        
        textarea.addEventListener('input', (e) => {
            const length = e.target.value.length;
            charCount.textContent = length;
            if (length > 300) {
                charCount.parentElement.classList.add('text-error');
            } else {
                charCount.parentElement.classList.remove('text-error');
            }
        });

        // Toggle Logic
        const toggleBtn = document.getElementById('meal-toggle');
        const knob = document.getElementById('meal-toggle-knob');
        const inactiveState = document.getElementById('meal-inactive');
        const activeState = document.getElementById('meal-active');
        const removeBtn = document.getElementById('remove-meal');
        let isToggled = false;

        function updateToggleState() {
            if(isToggled) {
                toggleBtn.classList.replace('bg-surface-variant', 'bg-sumac-primary');
                knob.classList.replace('bg-outline', 'bg-on-primary');
                // RTL transform right to left
                knob.style.transform = 'translateX(-24px)';
                inactiveState.classList.add('hidden');
                activeState.classList.remove('hidden');
            } else {
                toggleBtn.classList.replace('bg-sumac-primary', 'bg-surface-variant');
                knob.classList.replace('bg-on-primary', 'bg-outline');
                knob.style.transform = 'translateX(0)';
                activeState.classList.add('hidden');
                inactiveState.classList.remove('hidden');
            }
        }

        toggleBtn.addEventListener('click', () => {
            isToggled = !isToggled;
            updateToggleState();
        });

        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isToggled = false;
            updateToggleState();
        });
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(43,33,26,0.06)]" data-active-classes="text-sumac-primary active"><div class="flex justify-around items-center h-16 px-2"><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-full text-muted-spice transition-colors" data-path="menu" href="#"><span class="material-symbols-outlined text-[24px]">restaurant_menu</span><span class="text-body-sm font-label-lg">القائمة</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-full text-muted-spice transition-colors" data-path="orders" href="#"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="text-body-sm font-label-lg">الطلبات</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-full text-muted-spice transition-colors" data-path="shorts" href="#"><span class="material-symbols-outlined text-[24px]">play_circle</span><span class="text-body-sm font-label-lg">الشورتس</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] h-full text-muted-spice transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined text-[24px]">account_circle</span><span class="text-body-sm font-label-lg">حسابي</span></a></div></nav></body></html>
