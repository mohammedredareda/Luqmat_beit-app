  </head><body class="bg-tahini-bg font-body-md text-on-background"><header class="fixed top-0 inset-x-0 z-50 bg-tahini-bg/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(43,33,26,0.04)] pt-safe"><div class="h-14 px-lg flex items-center justify-between"><div class="flex items-center gap-md"><button class="w-11 h-11 flex items-center justify-center text-sumac-primary active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined">arrow_forward</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface">Settings</h1></div><div class="w-8 h-8 rounded-full bg-sumac-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-14 bg-tahini-bg min-h-screen"><div class="flex flex-col w-full h-full relative">
<!-- Content Container -->
<div class="flex-1 px-lg pt-xl pb-32 flex flex-col gap-xl max-w-lg mx-auto w-full">
<!-- Instruction Section -->
<div class="flex flex-col gap-sm items-center text-center mt-md">
<div class="w-16 h-16 rounded-full bg-sumac-container flex items-center justify-center mb-sm shadow-sm relative">
<span class="material-symbols-outlined text-sumac-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">
          smartphone
        </span>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-surface shadow-sm border-[1.5px] border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-zaatar-secondary text-[14px]" style="font-variation-settings: 'FILL' 1;">
                autorenew
             </span>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">تحديث رقم الهاتف</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
        يرجى إدخال رقم الهاتف الجديد، سنرسل لك رمز تحقق للتأكيد.
      </p>
</div>
<!-- Input Section -->
<div class="flex flex-col gap-md">
<label class="font-label-lg text-label-lg text-muted-spice px-xs">رقم الهاتف الجديد</label>
<div class="relative flex items-center bg-surface rounded-xl shadow-sm border-[1.5px] border-outline transition-colors focus-within:border-sumac-primary focus-within:ring-1 focus-within:ring-sumac-primary/20" dir="ltr">
<!-- Country Code Dropdown (Visual only for this scope) -->
<button class="flex items-center gap-xs px-md py-3 text-on-surface border-r-[1.5px] border-outline hover:bg-surface-variant/50 transition-colors rounded-l-xl">
<span class="font-body-lg text-body-lg" dir="ltr">+963</span>
<span class="material-symbols-outlined text-[20px] text-muted-spice">arrow_drop_down</span>
</button>
<!-- Phone Input -->
<input autocomplete="off" class="flex-1 bg-transparent px-md py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none" dir="ltr" placeholder="9XX XXX XXX" type="tel"/>
<!-- Clear Button (Hidden by default, shown when text entered - handled by JS) -->
<button class="hidden absolute right-md text-muted-spice hover:text-on-surface p-1" id="clearBtn">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-muted-spice px-xs flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">info</span>
           تأكد من إدخال الرقم بشكل صحيح لتلقي الرمز
       </p>
</div>
</div>
<!-- Bottom Action Bar (Fixed to bottom above safe area) -->
<div class="fixed bottom-0 inset-x-0 bg-gradient-to-t from-tahini-bg via-tahini-bg to-transparent pt-xl pb-safe px-lg flex justify-center pb-lg z-10 pointer-events-none">
<div class="w-full max-w-lg pointer-events-auto">
<button class="w-full h-12 bg-sumac-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-md hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span>إرسال رمز التحقق</span>
<span class="material-symbols-outlined text-[20px] rtl:-scale-x-100">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.querySelector('input[type="tel"]');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.querySelector('button.bg-sumac-primary');

    // Input formatting (basic Syrian mobile pattern)
    input.addEventListener('input', function(e) {
      // Remove non-digits
      let value = this.value.replace(/\D/g, '');
      
      // Limit to 9 digits (Syrian mobile format without zero: 9XX XXX XXX)
      if (value.length > 9) {
          value = value.slice(0, 9);
      }

      // Format as 9XX XXX XXX
      let formatted = '';
      for (let i = 0; i < value.length; i++) {
          if (i === 3 || i === 6) formatted += ' ';
          formatted += value[i];
      }
      
      this.value = formatted;

      // Toggle clear button
      if (this.value.length > 0) {
          clearBtn.classList.remove('hidden');
      } else {
          clearBtn.classList.add('hidden');
      }
      
      // Basic validation for button state (needs 9 digits)
      if (value.length === 9) {
          submitBtn.classList.remove('opacity-50', 'pointer-events-none');
      } else {
          submitBtn.classList.add('opacity-50', 'pointer-events-none');
      }
    });

    clearBtn.addEventListener('click', (e) => {
        e.preventDefault(); // Prevent form submission if any
        input.value = '';
        clearBtn.classList.add('hidden');
        submitBtn.classList.add('opacity-50', 'pointer-events-none');
        input.focus();
    });
    
    // Initial state check
    if(input.value.replace(/\D/g, '').length !== 9) {
        submitBtn.classList.add('opacity-50', 'pointer-events-none');
    }
  });
</script></main></body></html>
