<body class="antialiased min-h-screen flex items-center justify-center p-lg">

<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-muted-spice active:scale-95">

</button>
</div>
<!-- Search -->

<div class="relative w-full">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-muted-spice material-symbols-outlined">search</span>

</div>
</div>
<!-- Scrollable Content -->

<!-- Step 1: Available Meals -->

<div class="grid grid-cols-2 gap-md">
<!-- Meal Card 1 (Selected) -->

</div>

</div>
<div class="p-card-padding">

</div>
</div>

<div class="relative w-full">
  <input type="text" id="variation-input" class="peer w-full px-4 py-3 rounded-xl border-1.5 border-outline bg-surface focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary text-ink-text font-body-md text-body-md placeholder-transparent outline-none transition-all" placeholder="مثال: نفر واحد، نفرين...">

<button class="px-xl h-12 text-muted-spice font-label-lg text-label-lg rounded-lg hover:bg-surface-variant transition-colors active:scale-95">

            </button>

<script>
        // Simple script to handle variation selection styling
        document.querySelectorAll('input[type="radio"][name="variation"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all labels
                document.querySelectorAll('input[type="radio"][name="variation"]').forEach(r => {
                    const label = r.closest('label');
                    const priceSpan = label.querySelector('.font-price-display');
                    label.classList.remove('border-sumac-primary', 'bg-sumac-container/20');
                    label.classList.add('border-outline');
                    priceSpan.classList.remove('text-sumac-primary');
                    priceSpan.classList.add('text-muted-spice');
                });
                
                // Style selected label
                if(this.checked) {
                    const label = this.closest('label');
                    const priceSpan = label.querySelector('.font-price-display');
                    label.classList.remove('border-outline', 'hover:border-outline-variant', 'hover:bg-surface-variant/50');
                    label.classList.add('border-sumac-primary', 'bg-sumac-container/20');
                    priceSpan.classList.remove('text-muted-spice');
                    priceSpan.classList.add('text-sumac-primary');
                }
            });
        });
    </script>
