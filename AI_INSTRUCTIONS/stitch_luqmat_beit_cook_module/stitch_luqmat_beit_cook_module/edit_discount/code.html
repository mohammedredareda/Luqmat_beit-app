<!-- Logic for Segmented Control -->
<script>
        function setMode(mode) {
            const btnDuration = document.getElementById('btn-duration');
            const btnUsage = document.getElementById('btn-usage');
            const formDuration = document.getElementById('form-duration');
            const formUsage = document.getElementById('form-usage');

            // Reset styles
            const activeClasses = ['bg-surface', 'shadow-[0_1px_3px_rgba(43,33,26,0.08)]', 'text-sumac-primary'];
            const inactiveClasses = ['text-muted-spice', 'hover:text-ink-text', 'hover:bg-surface-variant/30'];

            if (mode === 'duration') {
                // Style buttons
                btnDuration.classList.add(...activeClasses);
                btnDuration.classList.remove(...inactiveClasses);
                
                btnUsage.classList.remove(...activeClasses);
                btnUsage.classList.add(...inactiveClasses);

                // Show/Hide forms with transition
                formUsage.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => {
                    formUsage.classList.replace('visible', 'invisible');
                    formDuration.classList.replace('invisible', 'visible');
                    formDuration.classList.replace('opacity-0', 'opacity-100');
                }, 150);

            } else if (mode === 'usage') {
                // Style buttons
                btnUsage.classList.add(...activeClasses);
                btnUsage.classList.remove(...inactiveClasses);
                
                btnDuration.classList.remove(...activeClasses);
                btnDuration.classList.add(...inactiveClasses);

                // Show/Hide forms with transition
                formDuration.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => {
                    formDuration.classList.replace('visible', 'invisible');
                    formUsage.classList.replace('invisible', 'visible');
                    formUsage.classList.replace('opacity-0', 'opacity-100');
                }, 150);
            }
        }
        
        // Initialize date inputs with some dummy dates for mockup realism
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const nextWeek = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            document.getElementById('start-date').value = today;
            document.getElementById('end-date').value = nextWeek;
        });
    </script>
