        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-tahini-bg min-h-screen text-on-surface font-body-md relative overflow-hidden flex flex-col md:flex-row items-center justify-center p-lg gap-xl">
<!-- Success Dialog (Meal Created) -->
<div class="bg-surface rounded-xl shadow-lg border border-outline-variant max-w-sm w-full p-xl flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-zaatar-container text-on-secondary-container flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-display-lg">check</span>
</div>
<h2 class="font-title-lg text-title-lg text-ink-text mb-sm">تمت إضافة الوجبة بنجاح!</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">الوجبة الآن متاحة للزبائن في قائمتك.</p>
<button class="w-full bg-sumac-primary text-on-primary font-label-lg text-label-lg rounded-full py-md hover:bg-surface-tint transition-colors active:scale-95 duration-200 shadow-[0_2px_8px_rgba(43,33,26,0.15)] flex items-center justify-center">
            حسناً
        </button>
</div>
<!-- Delete Confirmation Dialog -->
<div class="bg-surface rounded-xl shadow-lg border border-outline-variant max-w-sm w-full p-xl flex flex-col text-center md:text-right">
<div class="flex items-center justify-center md:justify-start mb-md text-error">
<span class="material-symbols-outlined text-display-lg mr-md hidden md:block">delete_outline</span>
<h2 class="font-title-lg text-title-lg text-ink-text">حذف كبسة دجاج؟</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">سيتم إخفاء الوجبة من قائمتك نهائياً.</p>
<div class="flex flex-col md:flex-row gap-md w-full">
<button class="flex-1 md:order-2 border-2 border-error text-error font-label-lg text-label-lg rounded-full py-md hover:bg-error-container transition-colors active:scale-95 duration-200">
                حذف
            </button>
<button class="flex-1 md:order-1 text-sumac-primary font-label-lg text-label-lg rounded-full py-md hover:bg-sumac-container transition-colors active:scale-95 duration-200">
                إلغاء
            </button>
</div>
</div>
<!-- Success Snackbar (Profile Updated) - Fixed at bottom for demonstration, normally floating via JS -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 w-full max-w-md px-lg z-50">
<div class="bg-inverse-surface text-inverse-on-surface rounded-lg shadow-lg p-md flex items-center justify-between">
<span class="font-body-md text-body-md">تم تحديث الملف الشخصي بنجاح</span>
<button class="text-inverse-primary font-label-lg text-label-lg px-md py-sm rounded hover:bg-white/10 transition-colors ml-xs">
                إغلاق
            </button>
</div>
</div>
