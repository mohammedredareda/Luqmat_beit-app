<body class="bg-tahini-bg text-ink-text min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (From Shared Components) -->
<header class="docked full-width top-0 bg-tahini-bg flat no shadows">
<div class="flex justify-between items-center w-full px-lg py-md h-16">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center text-sumac-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-sumac-primary">Luqmat Beit</h1>
<div class="w-12 h-12 flex items-center justify-center">
<!-- Empty placeholder for balance, notifications omitted for auth flow -->
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-md bg-surface rounded-xl shadow-[0_2px_10px_rgba(43,33,26,0.08)] p-xl relative overflow-hidden">
<!-- Decorative Header Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-sumac-container rounded-bl-full -z-10 opacity-50"></div>
<div class="mb-xl text-center">
<h2 class="font-headline-md text-headline-md text-sumac-primary mb-sm">إعادة تعيين كلمة المرور</h2>
<p class="font-body-md text-body-md text-muted-spice">أدخل كلمة المرور الجديدة أدناه لتحديث حسابك.</p>
</div>
<form class="space-y-gutter" id="reset-password-form">
<!-- New Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-muted-spice" for="new-password">كلمة المرور الجديدة</label>
<div class="relative">
<input class="w-full h-12 px-md border-1.5 border-outline rounded-lg focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary bg-surface font-body-md text-ink-text transition-colors" id="new-password" minlength="8" name="new-password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-spice hover:text-sumac-primary p-2 w-12 h-12 flex items-center justify-center toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-muted-spice" for="confirm-password">تأكيد كلمة المرور</label>
<div class="relative">
<input class="w-full h-12 px-md border-1.5 border-outline rounded-lg focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary bg-surface font-body-md text-ink-text transition-colors" id="confirm-password" minlength="8" name="confirm-password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-spice hover:text-sumac-primary p-2 w-12 h-12 flex items-center justify-center toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="hidden font-body-sm text-body-sm text-error mt-xs flex items-center gap-1" id="password-error">
<span class="material-symbols-outlined text-[16px]">error</span>
                    كلمات المرور غير متطابقة
                </p>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-xl bg-sumac-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center hover:bg-surface-tint active:scale-95 transition-all duration-200" type="submit">
                حفظ كلمة المرور
            </button>
</form>
<!-- Success Message Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface/95 backdrop-blur-sm z-10 hidden flex-col items-center justify-center p-xl text-center transition-opacity duration-300 opacity-0" id="success-overlay">
<div class="w-16 h-16 bg-zaatar-container rounded-full flex items-center justify-center text-zaatar-secondary mb-md shadow-lg shadow-[rgba(43,33,26,0.12)]">
<span class="material-symbols-outlined text-[32px]" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<h3 class="font-title-lg text-title-lg text-ink-text mb-sm">تم بنجاح!</h3>
<p class="font-body-md text-body-md text-muted-spice mb-xl">تم إعادة تعيين كلمة المرور الخاصة بك بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p>
<button class="w-full h-12 bg-sumac-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center hover:bg-surface-tint active:scale-95 transition-all duration-200">
                العودة لتسجيل الدخول
            </button>
</div>
</div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleButtons = document.querySelectorAll('.toggle-password');
        const form = document.getElementById('reset-password-form');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const passwordError = document.getElementById('password-error');
        const successOverlay = document.getElementById('success-overlay');

        // Toggle Password Visibility
        toggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });

        // Form Validation and Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset error state
            passwordError.classList.add('hidden');
            confirmPasswordInput.classList.remove('border-error', 'focus:border-error', 'focus:ring-error');
            confirmPasswordInput.classList.add('border-outline', 'focus:border-sumac-primary', 'focus:ring-sumac-primary');

            // Check if passwords match
            if (newPasswordInput.value !== confirmPasswordInput.value) {
                passwordError.classList.remove('hidden');
                confirmPasswordInput.classList.remove('border-outline', 'focus:border-sumac-primary', 'focus:ring-sumac-primary');
                confirmPasswordInput.classList.add('border-error', 'focus:border-error', 'focus:ring-error');
                return;
            }

            // Simulate successful API call
            setTimeout(() => {
                successOverlay.classList.remove('hidden');
                // Trigger reflow for transition
                void successOverlay.offsetWidth;
                successOverlay.classList.remove('opacity-0');
            }, 300);
        });
    });
</script>
