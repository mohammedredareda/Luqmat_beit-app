<body class="bg-tahini-bg min-h-screen text-on-background font-body-md flex flex-col pb-safe">
<!-- TopAppBar -->

<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>

<h1 class="font-headline-sm text-headline-sm font-bold text-sumac-primary dark:text-primary-fixed-dim">تعديل الوجبة</h1>
<div class="w-10"></div> <!-- Spacer to center title -->
</header>
<main class="flex-grow px-lg py-md flex flex-col gap-xl">
<!-- Image Picker Section -->
<section class="w-full relative aspect-video bg-surface-container-high rounded-xl flex flex-col items-center justify-center border-2 border-dashed border-outline hover:border-sumac-primary transition-colors cursor-pointer overflow-hidden group">

<div class="flex flex-col items-center justify-center gap-sm z-20 group-hover:scale-105 transition-transform absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center text-sumac-primary shadow-sm">
<span class="material-symbols-outlined text-[24px]">add_a_photo</span>
</div>
<p class="font-label-lg text-label-lg text-surface">تغيير الصورة</p>
</div>
<!-- Hidden file input -->
<input accept="image/*" class="hidden" id="meal-image-input" type="file">
</section>
<!-- Basic Info Section -->
<section class="bg-surface rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<h2 class="font-title-lg text-title-lg text-ink-text border-b border-surface-container-high pb-sm">المعلومات الأساسية</h2>
<!-- Name Input -->

<label class="font-label-lg text-label-lg text-muted-spice" for="meal-name">اسم الوجبة</label>
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-md focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-md" id="meal-name" type="text" value="كبسة دجاج">
</div>
<!-- Description Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-muted-spice" for="meal-desc">الوصف</label>
<textarea class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-md focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-md resize-none" id="meal-desc" rows="3">كبسة دجاج تقليدية مطبوخة بأجود أنواع الأرز البسمتي والتوابل الطازجة. تقدم مع صلصة الدقوس الحارة.</textarea>
</div>
</section>
<!-- Category Section (Chips) -->
<section class="bg-surface rounded-xl p-lg shadow-sm flex flex-col gap-lg">

<div class="w-1/3 relative">

                </button>
</div>
</section>
<!-- Availability -->
<section class="bg-surface rounded-xl p-card-padding shadow-sm flex items-center justify-between">
<div>
<h3 class="font-title-lg text-title-lg text-ink-text mb-1">متاح للطلب</h3>
<p class="font-body-sm text-body-sm text-muted-spice">إظهار الوجبة للعملاء في القائمة</p>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 -left-1 opacity-0" id="availability-toggle" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline cursor-pointer relative before:absolute before:inset-0 before:transition-colors before:duration-200 after:absolute after:top-0.5 after:right-0.5 after:bg-white after:w-5 after:h-5 after:rounded-full after:shadow-sm after:transition-transform after:duration-200" for="availability-toggle"></label>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col gap-md">
<button class="w-full bg-sumac-primary text-on-primary font-label-lg text-label-lg h-12 rounded-full shadow-md hover:bg-primary transition-colors active:scale-95 duration-200" type="submit">
                    حفظ التعديلات
                </button>
<button class="w-full bg-transparent text-error border border-error font-label-lg text-label-lg h-12 rounded-full hover:bg-error-container transition-colors active:scale-95 duration-200" type="button">
                    حذف الوجبة
                </button>
</div>
<!-- Bottom Spacing -->
<div class="h-4"></div>
</main>
<script>
        // Category Chips Logic
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                // Toggle selection state
                const isSelected = this.getAttribute('data-selected') === 'true';
                
                if (isSelected) {
                    this.setAttribute('data-selected', 'false');
                    this.classList.remove('bg-sumac-container', 'text-sumac-primary', 'border-sumac-primary');
                    this.classList.add('border-outline', 'text-muted-spice');
                } else {
                    this.setAttribute('data-selected', 'true');
                    this.classList.remove('border-outline', 'text-muted-spice');
                    this.classList.add('bg-sumac-container', 'text-sumac-primary', 'border-sumac-primary');
                }
            });
        });

        // Toggle Pricing Logic
        const variationsToggle = document.getElementById('variations-toggle');
        const singlePriceSection = document.getElementById('single-price-section');
        const variationsSection = document.getElementById('variations-section');

        variationsToggle.addEventListener('change', function() {
            if (this.checked) {
                // Show Variations, Hide Single
                singlePriceSection.classList.add('hidden');
                variationsSection.classList.remove('hidden');
            } else {
                // Show Single, Hide Variations
                variationsSection.classList.add('hidden');
                singlePriceSection.classList.remove('hidden');
            }
        });

        // Simulate Image Picker
        const imageSection = document.querySelector('section.aspect-video');
        const fileInput = document.getElementById('meal-image-input');
        const imagePreview = document.getElementById('image-preview');

        imageSection.addEventListener('click', () => {
            // In a real app, this would trigger: fileInput.click();
            // For UI demo, we'll just toggle the preview overlay to simulate selection
            if(imagePreview.style.backgroundImage === '') {
                 imagePreview.style.backgroundImage = "url('{{DATA:IMAGE:10}}')";
                 imagePreview.classList.remove('hidden');
            }
        });
    </script>
