<script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentSlide = 0;
            const totalSlides = 3;
            const nextBtn = document.getElementById('next-btn');
            const skipBtn = document.getElementById('skip-btn');

            function updateSlider(newIndex) {
                if(newIndex >= totalSlides) {
                    // Navigate to home/dashboard
                    alert('Navigate to Home');
                    return;
                }

                // Hide current
                const oldSlide = document.getElementById(`slide-${currentSlide}`);
                oldSlide.classList.remove('slide-visible');
                oldSlide.classList.add('slide-hidden');
                
                const oldDot = document.getElementById(`dot-${currentSlide}`);
                oldDot.classList.remove('bg-sumac-primary', 'w-6');
                oldDot.classList.add('bg-outline');

                currentSlide = newIndex;

                // Show new
                const newSlide = document.getElementById(`slide-${currentSlide}`);
                newSlide.classList.remove('slide-hidden');
                newSlide.classList.add('slide-visible');
                
                const newDot = document.getElementById(`dot-${currentSlide}`);
                newDot.classList.remove('bg-outline');
                newDot.classList.add('bg-sumac-primary', 'w-6');

                // Update button text on last slide
                if(currentSlide === totalSlides - 1) {
                    nextBtn.textContent = 'ابدأ الآن';
                    skipBtn.style.opacity = '0';
                    skipBtn.style.pointerEvents = 'none';
                } else {
                    nextBtn.textContent = 'التالي';
                    skipBtn.style.opacity = '1';
                    skipBtn.style.pointerEvents = 'auto';
                }
            }

            nextBtn.addEventListener('click', () => {
                updateSlider(currentSlide + 1);
            });

            skipBtn.addEventListener('click', () => {
                updateSlider(totalSlides - 1);
            });
        });
    </script>
