<script>
        // Simple entrance animation simulation for the dialog
        document.addEventListener('DOMContentLoaded', () => {
            const dialogOverlay = document.querySelector('.absolute.inset-0');
            const dialogSurface = document.querySelector('.rounded-dialog');
            
            // Set initial state for animation
            dialogOverlay.classList.remove('opacity-100');
            dialogOverlay.classList.add('opacity-0');
            dialogSurface.classList.remove('scale-100');
            dialogSurface.classList.add('scale-95');

            // Trigger animation on next frame
            requestAnimationFrame(() => {
                dialogOverlay.classList.remove('opacity-0');
                dialogOverlay.classList.add('opacity-100');
                dialogSurface.classList.remove('scale-95');
                dialogSurface.classList.add('scale-100');
            });
        });
    </script>
