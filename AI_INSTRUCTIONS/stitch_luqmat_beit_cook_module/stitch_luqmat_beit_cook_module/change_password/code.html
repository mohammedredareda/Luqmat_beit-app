<html dir="rtl" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;min-height:100vh;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-tertiary":"#ffffff","on-background":"#221a13","on-secondary-container":"#546c2e","primary":"#871a11","zaatar-container":"#E4EDD3","on-error-container":"#93000a","tertiary-fixed-dim":"#ffb95f","surface-tint":"#ab3428","on-error":"#ffffff","outline-variant":"#e0bfba","surface-bright":"#fff8f5","inverse-on-surface":"#ffeee2","on-tertiary-fixed-variant":"#653e00","zaatar-secondary":"#5A7233","inverse-primary":"#ffb4a9","error":"#ba1a1a","primary-container":"#a83226","error-container":"#ffdad6","secondary-fixed":"#d0eda0","on-secondary":"#ffffff","tertiary-fixed":"#ffddb8","primary-fixed-dim":"#ffb4a9","secondary":"#4e6628","inverse-surface":"#382e27","surface-container-lowest":"#ffffff","outline":"#D9CEC1","sumac-primary":"#A83226","surface-variant":"#f0dfd4","on-primary-fixed-variant":"#8a1c13","on-surface-variant":"#58413e","on-secondary-fixed":"#121f00","secondary-container":"#d0eda0","surface":"#FFFFFF","sumac-container":"#FADDD7","on-tertiary-container":"#ffcc91","surface-container-highest":"#f0dfd4","tertiary-container":"#825100","background":"#fff8f5","surface-container-high":"#f6e5da","ink-text":"#2A211A","surface-container-low":"#fff1e8","honey-tertiary":"#B97A1E","on-surface":"#221a13","on-primary":"#ffffff","tertiary":"#623c00","tahini-bg":"#FBF7F1","on-tertiary-fixed":"#2a1700","on-primary-fixed":"#410000","surface-container":"#fcebdf","muted-spice":"#71655B","surface-dim":"#e8d7cc","honey-container":"#F7E7CC","primary-fixed":"#ffdad5","on-secondary-fixed-variant":"#374d12","secondary-fixed-dim":"#b4d086","on-primary-container":"#ffc9c0"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{base:"4px",xxl:"32px",md:"12px",sm:"8px","card-padding":"14px",xs:"4px",xl:"24px",lg:"16px",gutter:"16px"},fontFamily:{"headline-sm":["Alexandria"],"headline-md":["Alexandria"],"body-sm":["Tajawal"],"price-display":["Tajawal"],"display-lg":["Alexandria"],"title-lg":["Alexandria"],"label-lg":["Tajawal"],"body-lg":["Tajawal"],"body-md":["Tajawal"]},fontSize:{"headline-sm":["18px",{lineHeight:"24px",fontWeight:"700"}],"headline-md":["22px",{lineHeight:"28px",fontWeight:"700"}],"body-sm":["12.5px",{lineHeight:"18px",fontWeight:"400"}],"price-display":["16px",{lineHeight:"20px",fontWeight:"800"}],"display-lg":["40px",{lineHeight:"48px",fontWeight:"800"}],"title-lg":["17px",{lineHeight:"22px",fontWeight:"700"}],"label-lg":["14px",{lineHeight:"20px",fontWeight:"700"}],"body-lg":["15.5px",{lineHeight:"26px",fontWeight:"500"}],"body-md":["14px",{lineHeight:"24px",fontWeight:"400"}]}}}}</script><style>

  </head><body class="bg-tahini-bg font-body-md text-on-background"><header class="fixed top-0 inset-x-0 z-50 bg-tahini-bg/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(43,33,26,0.04)] pt-safe"><div class="h-14 px-lg flex items-center justify-between"><div class="flex items-center gap-md"><button class="w-11 h-11 flex items-center justify-center text-sumac-primary active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined">arrow_forward</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface">Settings</h1></div><div class="w-8 h-8 rounded-full bg-sumac-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-14 bg-tahini-bg min-h-screen"><div class="flex flex-col w-full h-full pb-safe relative">
<div class="px-lg pt-xl pb-xxl flex flex-col gap-xl w-full max-w-md mx-auto">
<!-- Decorative Header / Illustration area -->
<div class="flex flex-col items-center justify-center pt-md pb-lg">
<div class="w-24 h-24 rounded-full bg-sumac-container flex items-center justify-center mb-md relative overflow-hidden shadow-sm">
<!-- Subtle background pattern inside circle -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at center, var(--tw-colors-sumac-primary) 1px, transparent 1px); background-size: 8px 8px;"></div>
<span class="material-symbols-outlined text-sumac-primary text-[40px] z-10" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface text-center">تحديث بيانات الأمان</h2>
<p class="font-body-md text-body-md text-muted-spice text-center mt-xs px-lg">يرجى إدخال كلمة المرور الحالية ثم تعيين كلمة مرور جديدة قوية.</p>
</div>
<form class="flex flex-col gap-lg" id="password-form" onsubmit="event.preventDefault(); window.handlePasswordSubmit();">
<!-- Current Password -->
<div class="relative group">
<input class="peer w-full h-[56px] px-md pt-lg pb-xs bg-surface border-1.5 border-outline rounded-lg text-on-surface font-body-md text-body-md focus:outline-none focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary transition-colors disabled:bg-surface-variant disabled:text-on-surface-variant" id="current-password" name="current-password" placeholder=" " required="" type="password"/>
<label class="absolute right-md top-[18px] text-muted-spice font-body-md text-body-md transition-all duration-200 pointer-events-none peer-focus:top-[8px] peer-focus:text-[11px] peer-focus:text-sumac-primary peer-[:not(:placeholder-shown)]:top-[8px] peer-[:not(:placeholder-shown)]:text-[11px]" for="current-password">
                    كلمة المرور الحالية
                </label>
<button class="absolute left-md top-1/2 -translate-y-1/2 text-muted-spice p-xs hover:text-on-surface transition-colors focus:outline-none rounded-full focus:ring-2 focus:ring-sumac-primary" onclick="window.togglePasswordVisibility('current-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="current-password-icon">visibility_off</span>
</button>
</div>
<!-- New Password -->
<div class="relative group mt-sm">
<input class="peer w-full h-[56px] px-md pt-lg pb-xs bg-surface border-1.5 border-outline rounded-lg text-on-surface font-body-md text-body-md focus:outline-none focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary transition-colors" id="new-password" name="new-password" onkeyup="window.checkPasswordStrength()" placeholder=" " required="" type="password"/>
<label class="absolute right-md top-[18px] text-muted-spice font-body-md text-body-md transition-all duration-200 pointer-events-none peer-focus:top-[8px] peer-focus:text-[11px] peer-focus:text-sumac-primary peer-[:not(:placeholder-shown)]:top-[8px] peer-[:not(:placeholder-shown)]:text-[11px]" for="new-password">
                    كلمة المرور الجديدة
                </label>
<button class="absolute left-md top-1/2 -translate-y-1/2 text-muted-spice p-xs hover:text-on-surface transition-colors focus:outline-none rounded-full focus:ring-2 focus:ring-sumac-primary" onclick="window.togglePasswordVisibility('new-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="new-password-icon">visibility_off</span>
</button>
<!-- Password Strength Indicator -->
<div class="flex gap-xs mt-sm h-1 px-xs" id="strength-bars">
<div class="flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar-1"></div>
<div class="flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar-2"></div>
<div class="flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar-3"></div>
<div class="flex-1 rounded-full bg-surface-variant transition-colors duration-300" id="bar-4"></div>
</div>
<p class="text-[11px] font-body-sm text-muted-spice mt-xs pr-xs h-4 transition-opacity duration-200 opacity-0" id="strength-text">يجب أن تحتوي على 8 أحرف على الأقل</p>
</div>
<!-- Confirm New Password -->
<div class="relative group">
<input class="peer w-full h-[56px] px-md pt-lg pb-xs bg-surface border-1.5 border-outline rounded-lg text-on-surface font-body-md text-body-md focus:outline-none focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary transition-colors" id="confirm-password" name="confirm-password" onkeyup="window.checkPasswordMatch()" placeholder=" " required="" type="password"/>
<label class="absolute right-md top-[18px] text-muted-spice font-body-md text-body-md transition-all duration-200 pointer-events-none peer-focus:top-[8px] peer-focus:text-[11px] peer-focus:text-sumac-primary peer-[:not(:placeholder-shown)]:top-[8px] peer-[:not(:placeholder-shown)]:text-[11px]" for="confirm-password">
                    تأكيد كلمة المرور الجديدة
                </label>
<button class="absolute left-md top-1/2 -translate-y-1/2 text-muted-spice p-xs hover:text-on-surface transition-colors focus:outline-none rounded-full focus:ring-2 focus:ring-sumac-primary" onclick="window.togglePasswordVisibility('confirm-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-password-icon">visibility_off</span>
</button>
<p class="text-[11px] font-body-sm text-error mt-xs pr-xs h-4 hidden" id="match-error">كلمات المرور غير متطابقة</p>
</div>
</form>
</div>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 inset-x-0 p-lg bg-gradient-to-t from-tahini-bg via-tahini-bg to-transparent pb-safe z-10">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-[48px] bg-sumac-primary text-on-primary rounded-lg font-label-lg text-label-lg shadow-sm hover:bg-sumac-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed" disabled="" form="password-form" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                تحديث كلمة المرور
            </button>
</div>
</div>
</div>
<script>
    window.togglePasswordVisibility = function(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(inputId + '-icon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
            icon.classList.add('text-sumac-primary');
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
            icon.classList.remove('text-sumac-primary');
        }
        
        // Add a tiny bounce animation to the icon
        icon.style.transform = 'scale(0.8)';
        setTimeout(() => { icon.style.transform = 'scale(1)'; }, 150);
        icon.style.transition = 'transform 150ms ease-in-out';
    };

    window.checkPasswordStrength = function() {
        const val = document.getElementById('new-password').value;
        const bars = [
            document.getElementById('bar-1'),
            document.getElementById('bar-2'),
            document.getElementById('bar-3'),
            document.getElementById('bar-4')
        ];
        const text = document.getElementById('strength-text');
        
        // Reset
        bars.forEach(b => b.className = 'flex-1 rounded-full bg-surface-variant transition-colors duration-300');
        text.style.opacity = val.length > 0 ? '1' : '0';
        
        let strength = 0;
        if (val.length >= 8) strength++;
        if (val.match(/[A-Z]/)) strength++;
        if (val.match(/[0-9]/)) strength++;
        if (val.match(/[^A-Za-z0-9]/)) strength++;

        if (val.length === 0) {
            text.textContent = 'يجب أن تحتوي على 8 أحرف على الأقل';
            text.className = 'text-[11px] font-body-sm text-muted-spice mt-xs pr-xs h-4 transition-opacity duration-200';
            return;
        }

        if (strength <= 1) {
            bars[0].className = 'flex-1 rounded-full bg-error transition-colors duration-300';
            text.textContent = 'ضعيفة - أضف أرقام ورموز';
            text.className = 'text-[11px] font-body-sm text-error mt-xs pr-xs h-4 transition-opacity duration-200';
        } else if (strength === 2) {
            bars[0].className = bars[1].className = 'flex-1 rounded-full bg-tertiary-fixed-dim transition-colors duration-300';
            text.textContent = 'متوسطة - يمكن أن تكون أقوى';
            text.className = 'text-[11px] font-body-sm text-tertiary mt-xs pr-xs h-4 transition-opacity duration-200';
        } else if (strength === 3) {
            bars[0].className = bars[1].className = bars[2].className = 'flex-1 rounded-full bg-secondary transition-colors duration-300';
            text.textContent = 'جيدة - أضف المزيد من الرموز';
            text.className = 'text-[11px] font-body-sm text-secondary mt-xs pr-xs h-4 transition-opacity duration-200';
        } else {
            bars.forEach(b => b.className = 'flex-1 rounded-full bg-on-secondary-container transition-colors duration-300');
            text.textContent = 'قوية جداً';
            text.className = 'text-[11px] font-body-sm text-on-secondary-container mt-xs pr-xs h-4 transition-opacity duration-200';
        }
        
        window.checkPasswordMatch();
    };

    window.checkPasswordMatch = function() {
        const newPass = document.getElementById('new-password').value;
        const confirmPass = document.getElementById('confirm-password').value;
        const errorMsg = document.getElementById('match-error');
        const confirmInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');
        const currentPass = document.getElementById('current-password').value;

        if (confirmPass.length > 0 && newPass !== confirmPass) {
            errorMsg.classList.remove('hidden');
            confirmInput.classList.add('border-error');
            confirmInput.classList.remove('border-outline', 'focus:border-sumac-primary');
            submitBtn.disabled = true;
        } else {
            errorMsg.classList.add('hidden');
            confirmInput.classList.remove('border-error');
            confirmInput.classList.add('border-outline', 'focus:border-sumac-primary');
            
            // Enable button only if all conditions met
            const isStrongEnough = newPass.length >= 8;
            const isMatched = newPass === confirmPass && newPass !== '';
            const hasCurrent = currentPass.length > 0;
            
            submitBtn.disabled = !(isStrongEnough && isMatched && hasCurrent);
        }
    };
    
    // Add listener for current password to re-check button state
    document.getElementById('current-password').addEventListener('keyup', window.checkPasswordMatch);

    window.handlePasswordSubmit = function() {
        const btn = document.getElementById('submit-btn');
        const originalContent = btn.innerHTML;
        
        // Loading state
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> جاري التحديث...';
        btn.disabled = true;
        
        // Simulate API call
        setTimeout(() => {
            btn.classList.remove('bg-sumac-primary');
            btn.classList.add('bg-secondary');
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span> تم التحديث بنجاح';
            
            // Reset after success
            setTimeout(() => {
                document.getElementById('password-form').reset();
                window.checkPasswordStrength(); // reset UI
                btn.classList.add('bg-sumac-primary');
                btn.classList.remove('bg-secondary');
                btn.innerHTML = originalContent;
                btn.disabled = true;
            }, 2000);
        }, 1500);
    };
</script></main></body></html>
