<body class="bg-tahini-bg text-on-background font-body-md min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->

<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 p-2 rounded-full text-muted-spice">

<h1 class="font-headline-sm text-headline-sm font-bold text-sumac-primary">إضافة وجبة</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-lg py-md flex flex-col gap-xl">
<!-- Image Picker Section -->
<section class="w-full relative aspect-video bg-surface-container-high rounded-xl flex flex-col items-center justify-center border-2 border-dashed border-outline hover:border-sumac-primary transition-colors cursor-pointer overflow-hidden group">

<div class="flex flex-col items-center justify-center gap-sm z-20 group-hover:scale-105 transition-transform">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center text-sumac-primary shadow-sm">
<span class="material-symbols-outlined text-[24px]">add_a_photo</span>
</div>
<p class="font-label-lg text-label-lg text-muted-spice">أضف صورة للوجبة</p>
</div>
<!-- Hidden file input -->
<input accept="image/*" class="hidden" id="meal-image-input" type="file"/>
</section>
<!-- Basic Info Section -->
<section class="bg-surface rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<h2 class="font-title-lg text-title-lg text-ink-text border-b border-surface-container-high pb-sm">المعلومات الأساسية</h2>
<!-- Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-muted-spice" for="meal-name">اسم الوجبة</label>
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-md focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-md" id="meal-name" placeholder="مثال: ورق عنب باللحمة" type="text"/>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-muted-spice" for="meal-desc">الوصف</label>
<textarea class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-md focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-md resize-none" id="meal-desc" placeholder="اكتب وصفاً شهياً لمكونات الوجبة وطريقة التحضير..." rows="3"></textarea>
</div>
</section>
<!-- Category Section (Chips) -->
<section class="bg-surface rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<h2 class="font-title-lg text-title-lg text-ink-text border-b border-surface-container-high pb-sm">التصنيف</h2>
<div class="flex flex-wrap gap-sm" id="category-chips">
<button class="category-chip px-md py-sm rounded-full border border-outline text-muted-spice font-body-md transition-colors active:scale-95" data-selected="false">وجبات رئيسية</button>
<button class="category-chip px-md py-sm rounded-full border border-outline text-muted-spice font-body-md transition-colors active:scale-95" data-selected="false">معجنات</button>
<button class="category-chip px-md py-sm rounded-full border border-outline text-muted-spice font-body-md transition-colors active:scale-95" data-selected="false">حلويات</button>
<button class="category-chip px-md py-sm rounded-full border border-outline text-muted-spice font-body-md transition-colors active:scale-95" data-selected="false">مقبلات</button>
<button class="category-chip px-md py-sm rounded-full border border-outline text-muted-spice font-body-md transition-colors active:scale-95" data-selected="false">مشروبات</button>
</div>
</section>

<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-muted-spice flex items-center gap-xs" for="preorder-time">
<span class="material-symbols-outlined text-[16px]">event_available</span>
                    الطلب المسبق
                </label>
<div class="relative">
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-md pl-xl focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-md text-left" dir="ltr" id="preorder-time" placeholder="24" type="number"/>

</div>
</div>

<section class="bg-surface rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<div class="flex justify-between items-center border-b border-surface-container-high pb-sm">
<h2 class="font-title-lg text-title-lg text-ink-text">التسعير والخيارات</h2>
<!-- Custom Toggle Switch -->
<div class="flex items-center gap-sm">
<span class="font-label-lg text-label-lg text-muted-spice">خيارات بيع</span>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 -left-1 opacity-0" id="variations-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-outline cursor-pointer relative before:absolute before:inset-0 before:transition-colors before:duration-200 after:absolute after:top-0.5 after:right-0.5 after:bg-white after:w-5 after:h-5 after:rounded-full after:shadow-sm after:transition-transform after:duration-200" for="variations-toggle"></label>
</div>
</div>
</div>
<!-- Single Price (Default state) -->
<div class="flex flex-col gap-xs transition-all duration-300" id="single-price-section">

<div class="w-1/3 relative">
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-sm pl-8 focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-price-display text-left" dir="ltr" placeholder="السعر" type="number"/>

</div>
<button class="p-2 text-error hover:bg-error-container rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Variation Item 2 -->
<div class="flex items-center gap-sm">
<div class="flex-1 relative">
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-sm focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-body-sm" placeholder="الحجم (مثال: كبير)" type="text"/>
</div>
<div class="w-1/3 relative">
<input class="w-full bg-transparent border-1.5 border-outline rounded-lg px-md py-sm pl-8 focus:border-sumac-primary focus:ring-1 focus:ring-sumac-primary outline-none transition-colors font-price-display text-left" dir="ltr" placeholder="السعر" type="number"/>
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-ink-text text-[10px]">ر.س</span>
</div>
<button class="p-2 text-error hover:bg-error-container rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Add Variation Button -->
<button class="w-full py-sm border border-dashed border-sumac-primary text-sumac-primary rounded-lg flex items-center justify-center gap-xs font-label-lg text-label-lg hover:bg-sumac-container transition-colors mt-xs">
<span class="material-symbols-outlined text-[20px]">add</span>
                    إضافة خيار آخر
                </button>
</div>
</section>
<!-- Bottom Spacing for floating button -->
<div class="h-24"></div>
</main>
<!-- Floating Action Button Container (Primary Action) -->
<div class="fixed bottom-0 left-0 w-full px-lg py-md bg-tahini-bg/90 backdrop-blur-md border-t border-outline-variant z-50">
<button class="w-full bg-sumac-primary text-on-primary font-headline-sm text-headline-sm py-md rounded-xl shadow-lg flex items-center justify-center gap-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined filled">done_all</span>
            إضافة الوجبة
        </button>
</div>
<script>
        // Category Chips Logic
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                // Toggle selection state
                const isSelected = this.getAttribute('data-selected') === 'true';
                
                if (isSelected) {
                    this.setAttribute('data-selected', 'false');
                    this.classList.remove('bg-sumac-container', 'text-sumac-primary', 'border-sumac-primary');
                    this.classList.add('border-outline', 'text-muted-spice');
                } else {
                    // Deselect others for single select (optional, keeping it multi-select for now as it might make sense for meals)
                    // If single select is desired, uncomment the next block:
                    /*
                    document.querySelectorAll('.category-chip').forEach(c => {
                        c.setAttribute('data-selected', 'false');
                        c.classList.remove('bg-sumac-container', 'text-sumac-primary', 'border-sumac-primary');
                        c.classList.add('border-outline', 'text-muted-spice');
                    });
                    */
                    
                    this.setAttribute('data-selected', 'true');
                    this.classList.remove('border-outline', 'text-muted-spice');
                    this.classList.add('bg-sumac-container', 'text-sumac-primary', 'border-sumac-primary');
                }
            });
        });

        // Toggle Pricing Logic
        const variationsToggle = document.getElementById('variations-toggle');
        const singlePriceSection = document.getElementById('single-price-section');
        const variationsSection = document.getElementById('variations-section');

        variationsToggle.addEventListener('change', function() {
            if (this.checked) {
                // Show Variations, Hide Single
                singlePriceSection.classList.add('hidden');
                variationsSection.classList.remove('hidden');
            } else {
                // Show Single, Hide Variations
                variationsSection.classList.add('hidden');
                singlePriceSection.classList.remove('hidden');
            }
        });

        // Simulate Image Picker
        const imageSection = document.querySelector('section.aspect-video');
        const fileInput = document.getElementById('meal-image-input');
        const imagePreview = document.getElementById('image-preview');

        imageSection.addEventListener('click', () => {
            // In a real app, this would trigger: fileInput.click();
            // For UI demo, we'll just toggle the preview overlay to simulate selection
            imagePreview.classList.toggle('hidden');
        });
    </script>
</body></html>
