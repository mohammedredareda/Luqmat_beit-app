<script>
        // Simple logic for the toggle switch interaction
        const toggle = document.getElementById('toggle');
        const statusText = toggle.closest('section').querySelector('.text-zaatar-secondary, .text-muted-spice');
        
        toggle.addEventListener('change', (e) => {
            if(e.target.checked) {
                statusText.textContent = "مفعّل - جاهز لاستقبال الطلبات";
                statusText.classList.remove('text-muted-spice');
                statusText.classList.add('text-zaatar-secondary');
            } else {
                statusText.textContent = "متوقف - غير متاح للطلبات";
                statusText.classList.remove('text-zaatar-secondary');
                statusText.classList.add('text-muted-spice');
            }
        });
