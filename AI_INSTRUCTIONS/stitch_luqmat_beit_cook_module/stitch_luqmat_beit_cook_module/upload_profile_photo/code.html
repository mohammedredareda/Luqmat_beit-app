<body class="bg-tahini-bg text-ink-text antialiased min-h-screen flex flex-col items-center justify-center font-body-md">
<!-- Top App Bar (From Shared Components) -->
<header class="fixed top-0 w-full z-50 bg-tahini-bg dark:bg-on-background flat no shadows flex justify-between items-center px-lg py-md h-16">
<button aria-label="Go back" class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 p-2 text-sumac-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-sumac-primary dark:text-primary-fixed-dim">Luqmat Beit</h1>
<!-- Using a placeholder for alignment, no trailing icon needed here based on intent -->
<div class="w-[40px]"></div>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-md px-lg pt-24 pb-safe flex flex-col items-center mt-xl flex-grow justify-center">
<!-- Header Text -->
<div class="text-center mb-xl w-full">
<h2 class="font-headline-md text-headline-md text-sumac-primary mb-sm">أضف صورة شخصية</h2>
<p class="font-body-lg text-body-lg text-muted-spice px-md">
                تساعد الصورة الشخصية في بناء الثقة مع المجتمع وتسهيل التعرف عليك عند استلام الطلبات.
            </p>
</div>
<!-- Avatar Picker (Glassmorphism inspired container) -->
<div class="relative mb-xxl flex flex-col items-center group">
<div class="w-32 h-32 rounded-full bg-surface shadow-[0_-2px_10px_rgba(43,33,26,0.08)] flex items-center justify-center overflow-hidden border-2 border-dashed border-outline hover:border-sumac-primary transition-colors cursor-pointer active:scale-95 duration-200 relative group-hover:bg-surface-container-low">
<!-- Placeholder Avatar Icon -->
<span class="material-symbols-outlined text-muted-spice text-6xl group-hover:text-sumac-primary transition-colors" style="font-variation-settings: 'FILL' 0; font-size: 64px;">account_circle</span>
<!-- Overlay on hover -->
<div class="absolute inset-0 bg-surface/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
<span class="material-symbols-outlined text-sumac-primary" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<!-- Floating add icon -->
<button aria-label="Upload Photo" class="absolute bottom-0 right-0 w-10 h-10 bg-sumac-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:bg-primary transition-colors active:scale-90 duration-200 -mr-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</button>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md mt-auto pb-xl">
<!-- Choose Photo Button -->
<button class="w-full h-12 rounded-lg border-2 border-outline text-sumac-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-sumac-container hover:border-sumac-container transition-colors active:scale-[0.98] duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">upload</span>
                اختيار صورة
            </button>
<!-- Primary Continue Button -->
<button class="w-full h-12 rounded-lg bg-sumac-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center hover:bg-primary transition-colors shadow-sm active:scale-[0.98] duration-200 mt-sm opacity-50 cursor-not-allowed" disabled="">
                متابعة
            </button>
<!-- Skip Link -->
<button class="mt-sm font-body-md text-body-md text-muted-spice hover:text-sumac-primary transition-colors underline decoration-transparent hover:decoration-sumac-primary underline-offset-4">
                تخطي الآن
            </button>
</div>
</main>
<!-- Note: BottomNavBar is intentionally omitted as this is an onboarding/transactional screen -->
<script>
        // Simple JS to simulate photo upload state change for demonstration
        document.querySelector('.group').addEventListener('click', function() {
            const continueBtn = document.querySelector('button[disabled]');
            if(continueBtn) {
                continueBtn.removeAttribute('disabled');
                continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                // Simulate an image being added (in a real app, this would show the selected image)
                const avatarIcon = document.querySelector('.material-symbols-outlined.text-6xl');
                avatarIcon.classList.add('text-sumac-primary');
                avatarIcon.classList.remove('text-muted-spice');
                avatarIcon.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
